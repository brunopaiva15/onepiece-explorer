name: Réparations (production)

# Runs a repair script against the production database, on a button press.
#
# The sibling of migrate.yml, and for the same reason: a repair needs the
# repository, Node, pnpm and a production credential in one place, and a laptop
# is not always that place. It is also the only way to run one from an
# environment that cannot open a Postgres connection at all — a sandbox, a phone,
# a review session — which is how the first of these scripts came to be written
# without ever being run against the library it was written for.
#
# A repair is not a migration and the difference is why this file is separate:
#
#   * A migration changes the schema and is written once for every library.
#     `db:push` tracks what it has applied and refuses a file that changed after
#     the fact.
#   * A repair changes *knowledge* — someone's own graph — and is written for a
#     defect found by reading it. Nothing tracks it, so every script here is
#     written to be re-runnable and to say « déjà fait » rather than do it twice.
#
# Hence the default below. `dry-run` is the mode you get unless you ask for the
# other one, because the interesting output of a repair is usually the list of
# what it *would* touch — that list is what tells you the script found the right
# rows before it is allowed to write anything.
#
# What it needs, once: the repository secret PRODUCTION_DIRECT_URL, which
# migrate.yml already uses. Nothing new to configure if migrations have ever
# been run from here — unless you run `illustrations`, which is the one script
# that also needs the bucket. See below.
#
# One order to respect, and it is not enforced here on purpose. `chapitre-1`
# writes a name with no revelation chapter, which the schema only accepts from
# migration 0027 onwards — so run migrate.yml first. It is left to the operator
# rather than chained automatically because a repair workflow that migrates on
# its own would apply schema changes nobody asked it to; the failure, if the
# order is wrong, is a constraint error on the first write and nothing else.
#
# One more, softer. `chapitres-1-100` reads scenes that `chapitres-1-42` writes —
# the chapter 33 summary that gives Zoro his swords back is where a question
# opened at 31 is re-answered — so run the shorter one first. Out of order it
# does not fail: the lines that cannot find their scene say « introuvable » and
# a second run picks them up.
#
# And a third, softer still. `noms` looks its couples up **by label**, so run
# `details` before it: that one corrects spellings and joins the nodes that are
# genuinely doubled, and a name it has not yet corrected is a couple this one
# reports as « introuvable » rather than mis-joining. Out of order it writes
# nothing wrong; it just finds less, and a second run finds the rest.
#
# `noms` is also the one repair whose interesting output is the list it *refuses*.
# It dates every revelation from the source text rather than from a table, so a
# couple it cannot date, or one whose name was already readable when the node was
# created, is printed with the reason and left alone. Read that list before
# switching to « appliquer » — it is the difference between a revelation and a
# duplicate, and only the first belongs to this script.
#
# `illustrations` is the only one that can touch the **bucket**. The others move
# knowledge between rows; this one forgets pictures, and a picture is a row plus
# two objects in the private bucket. So it reads three more secrets when they
# exist — NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY (wanted by the
# configuration schema rather than by the bucket, which validates the whole
# object at once) and SUPABASE_SERVICE_ROLE_KEY.
#
# *When they exist.* Without them the repair still runs, forgets the right rows
# and names the files it could not delete; what is left is unreachable storage,
# not a broken picture. That is the same trade `repair:chapitre-1` has always
# made — it deletes `entity_images` rows and never opens the bucket — so
# demanding them here would have been a stricter rule than the repair beside it.
#
# It also leaves holes deliberately: a wiki illustration the current rules refuse
# is forgotten and nothing replaces it in the same pass. Filling them is the
# « Chercher une image pour N entité(s) » button in /admin/reglages, which is the
# ordinary enrichment and needs no workflow. Run the repair here, then press it.
#
# Two of them are not like the others, and it is worth knowing before pressing
# the button. `mysteres` and `identites` both read: they ask a model, once per
# item, about the chapters that follow. So they also need ANTHROPIC_API_KEY, they
# cost real money — a few dollars for a backlog of seventy, in either mode,
# because a dry run makes the same calls and only skips the writing — and they
# take minutes rather than seconds, which is why the timeout below is not a
# single number. Without the key they stop before the first item: the fallback
# providers answer by counting shared words, and « Où se trouve le trésor de Gold
# Roger ? » would close on the first scene containing « trésor ».
#
# And they differ from each other on the one point that matters. `mysteres`
# writes into the graph, and says so: a machine judgement recorded as one.
# `identites` does not. An identity is the one judgement the ontology puts in
# mandatory human review, because a wrong merge destroys the chronology of
# revelations this whole product exists to hold — so the sweep writes **review
# cards**, with their citation, and you accept them in the review centre. Which
# also means « appliquer » is milder here than anywhere else on this form: it
# queues questions, it does not answer them.
#
# `identites` supersedes `noms` and does not replace it. `noms` carries seven
# couples read off the story thread by hand: free, instant, and exactly as
# complete as that list. `identites` finds them instead of listing them, which is
# what a thousand chapters need, and costs a model call per unnamed figure. Run
# `noms` first if you want the known seven for nothing.

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Quelle réparation'
        required: true
        type: choice
        default: chapitres-1-42
        options:
          - chapitres-1-42
          - chapitres-1-100
          - chapitre-1
          - details
          - noms
          - identites
          - luffy-crew
          - illustrations
          - mysteres
      limit:
        description: 'mysteres : n''examiner que les N plus anciennes (vide = toutes)'
        required: false
        default: ''
      mode:
        description: 'Mode'
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - appliquer
      confirm:
        description: 'Pour « appliquer » : tapez PRODUCTION'
        required: false
        default: ''

# Two repairs at once would interleave their writes on the same graph.
concurrency:
  group: repair-production
  cancel-in-progress: false

jobs:
  repair:
    name: ${{ inputs.script }} (${{ inputs.mode }})
    runs-on: ubuntu-latest
    # A SQL repair that has not finished in a quarter of an hour is stuck. The
    # sweep is not stuck — it is a model call per open question, in sequence —
    # and neither is the illustration pass, which is one wiki lookup per stored
    # picture, paced on purpose.
    timeout-minutes: ${{ (inputs.script == 'mysteres' || inputs.script == 'identites') && 60 || inputs.script == 'illustrations' && 45 || 15 }}

    steps:
      # Only the writing mode asks for a typed answer. A dry run reads and
      # prints, so making it as expensive to start as a write would teach
      # everyone to skip straight to the write.
      - name: Check the confirmation
        run: |
          if [ "${{ inputs.mode }}" = "appliquer" ] && [ "${{ inputs.confirm }}" != "PRODUCTION" ]; then
            echo "Mode « appliquer » : relancez en tapant PRODUCTION dans le champ de confirmation."
            exit 1
          fi

      - name: Check the secret is present
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "Le secret PRODUCTION_DIRECT_URL n'est pas configuré."
            echo "Settings → Secrets and variables → Actions → New repository secret."
            echo "Valeur : la chaîne du pooler Supabase en mode session (port 5432)."
            exit 1
          fi

      # A warning, not a gate — and the difference is the whole point of this
      # step. `illustrations` is the only repair that can clean the bucket, so
      # it is the only one that has anything to say about these three secrets;
      # but without them it still forgets the right rows and still names the
      # files it could not delete. `repair:chapitre-1` has always deleted
      # `entity_images` rows and left their bytes, so refusing to start here
      # would have been a stricter rule than the repair beside it, for a cost
      # measured in kilobytes of unreachable file.
      #
      # Written as three `if`s rather than three `[ … ] && …` lines: the shell
      # runs with `-e`, and a bare test that comes out false is a step that
      # fails — which is exactly what this step must not do.
      - name: Note the bucket credentials
        if: inputs.script == 'illustrations'
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=""
          if [ -z "$SUPABASE_URL" ]; then missing="$missing NEXT_PUBLIC_SUPABASE_URL"; fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then missing="$missing NEXT_PUBLIC_SUPABASE_ANON_KEY"; fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then missing="$missing SUPABASE_SERVICE_ROLE_KEY"; fi
          if [ -n "$missing" ]; then
            echo "::warning::Sans$missing, les lignes seront oubliées mais leurs fichiers resteront dans le seau."
            echo "La réparation tourne quand même : c'est du stockage inutilisé, pas une image cassée."
            echo "Pour qu'elle nettoie aussi les octets, ajoutez ces secrets"
            echo "(Settings → Secrets and variables → Actions ; valeurs : projet Supabase → Settings → API)."
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Each script prints what it found, what it changed and what was already
      # done. That output is the record of the run — there is no other one, and
      # a repair that says nothing is a repair nobody can check.
      - name: pnpm repair:${{ inputs.script }}
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
          # Only `mysteres` reads it, and it stops with an explanation if it is
          # missing. Passed to every script rather than conditionally, because a
          # conditional env is one more thing to get wrong for a value the other
          # two never look at.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Same reasoning for the bucket: only `illustrations` opens it, and the
          # step above has already refused to start without these three when it
          # is the script chosen.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Through the environment, not through `${{ }}` in the script below.
          # `script` and `mode` are `choice` inputs and GitHub only ever sends
          # one of the listed values; `limit` is free text, and free text
          # expanded into a shell command is that text *becoming* the command.
          LIMIT: ${{ inputs.limit }}
        run: |
          args=""
          if [ "${{ inputs.mode }}" = "dry-run" ]; then
            args="--dry-run"
          fi
          limit="$LIMIT"
          if [ -n "$limit" ]; then
            case "$limit" in
              ''|*[!0-9]*)
                echo "« limit » attend un entier positif, reçu : $limit"
                exit 1
                ;;
            esac
            args="$args --limit=$limit"
          fi
          pnpm repair:${{ inputs.script }} -- $args

      # This one takes pictures away and puts none back, on purpose. The person
      # reading the log is the one who decides whether to fill the holes.
      - name: What is left to do
        if: inputs.script == 'illustrations' && inputs.mode == 'appliquer'
        run: |
          echo "Les entités qui viennent de perdre leur image n'en ont plus aucune."
          echo "Pour les remplir : /admin/reglages → « Chercher une image pour N entité(s) »."
