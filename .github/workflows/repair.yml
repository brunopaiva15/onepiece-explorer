name: Réparations (production)

# Runs a repair script against the production database, on a button press.
#
# The sibling of migrate.yml, and for the same reason: a repair needs the
# repository, Node, pnpm and a production credential in one place, and a laptop
# is not always that place. It is also the only way to run one from an
# environment that cannot open a Postgres connection at all — a sandbox, a phone,
# a review session — which is how the first of these scripts came to be written
# without ever being run against the library it was written for.
#
# A repair is not a migration and the difference is why this file is separate:
#
#   * A migration changes the schema and is written once for every library.
#     `db:push` tracks what it has applied and refuses a file that changed after
#     the fact.
#   * A repair changes *knowledge* — someone's own graph — and is written for a
#     defect found by reading it. Nothing tracks it, so every script here is
#     written to be re-runnable and to say « déjà fait » rather than do it twice.
#
# Hence the default below. `dry-run` is the mode you get unless you ask for the
# other one, because the interesting output of a repair is usually the list of
# what it *would* touch — that list is what tells you the script found the right
# rows before it is allowed to write anything.
#
# What it needs, once: the repository secret PRODUCTION_DIRECT_URL, which
# migrate.yml already uses. Nothing new to configure if migrations have ever
# been run from here.
#
# One order to respect, and it is not enforced here on purpose. `chapitre-1`
# writes a name with no revelation chapter, which the schema only accepts from
# migration 0027 onwards — so run migrate.yml first. It is left to the operator
# rather than chained automatically because a repair workflow that migrates on
# its own would apply schema changes nobody asked it to; the failure, if the
# order is wrong, is a constraint error on the first write and nothing else.
#
# One of them is not like the others, and it is worth knowing before pressing
# the button. `mysteres` reads: it asks a model, once per open question, whether
# the scenes published after it carry the answer. So it also needs
# ANTHROPIC_API_KEY, it costs real money — a few dollars for a backlog of
# seventy, in either mode, because a dry run makes the same calls and only skips
# the writing — and it takes minutes rather than seconds, which is why the
# timeout below is not a single number. Without the key the script stops before
# the first question: the fallback providers answer by counting shared words,
# and « Où se trouve le trésor de Gold Roger ? » would close on the first scene
# containing « trésor ».

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Quelle réparation'
        required: true
        type: choice
        default: chapitres-1-42
        options:
          - chapitres-1-42
          - chapitre-1
          - luffy-crew
          - mysteres
      limit:
        description: 'mysteres : n''examiner que les N plus anciennes (vide = toutes)'
        required: false
        default: ''
      mode:
        description: 'Mode'
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - appliquer
      confirm:
        description: 'Pour « appliquer » : tapez PRODUCTION'
        required: false
        default: ''

# Two repairs at once would interleave their writes on the same graph.
concurrency:
  group: repair-production
  cancel-in-progress: false

jobs:
  repair:
    name: ${{ inputs.script }} (${{ inputs.mode }})
    runs-on: ubuntu-latest
    # A SQL repair that has not finished in a quarter of an hour is stuck. The
    # sweep is not stuck — it is a model call per open question, in sequence.
    timeout-minutes: ${{ inputs.script == 'mysteres' && 60 || 15 }}

    steps:
      # Only the writing mode asks for a typed answer. A dry run reads and
      # prints, so making it as expensive to start as a write would teach
      # everyone to skip straight to the write.
      - name: Check the confirmation
        run: |
          if [ "${{ inputs.mode }}" = "appliquer" ] && [ "${{ inputs.confirm }}" != "PRODUCTION" ]; then
            echo "Mode « appliquer » : relancez en tapant PRODUCTION dans le champ de confirmation."
            exit 1
          fi

      - name: Check the secret is present
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "Le secret PRODUCTION_DIRECT_URL n'est pas configuré."
            echo "Settings → Secrets and variables → Actions → New repository secret."
            echo "Valeur : la chaîne du pooler Supabase en mode session (port 5432)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Each script prints what it found, what it changed and what was already
      # done. That output is the record of the run — there is no other one, and
      # a repair that says nothing is a repair nobody can check.
      - name: pnpm repair:${{ inputs.script }}
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
          # Only `mysteres` reads it, and it stops with an explanation if it is
          # missing. Passed to every script rather than conditionally, because a
          # conditional env is one more thing to get wrong for a value the other
          # two never look at.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Through the environment, not through `${{ }}` in the script below.
          # `script` and `mode` are `choice` inputs and GitHub only ever sends
          # one of the listed values; `limit` is free text, and free text
          # expanded into a shell command is that text *becoming* the command.
          LIMIT: ${{ inputs.limit }}
        run: |
          args=""
          if [ "${{ inputs.mode }}" = "dry-run" ]; then
            args="--dry-run"
          fi
          limit="$LIMIT"
          if [ -n "$limit" ]; then
            case "$limit" in
              ''|*[!0-9]*)
                echo "« limit » attend un entier positif, reçu : $limit"
                exit 1
                ;;
            esac
            args="$args --limit=$limit"
          fi
          pnpm repair:${{ inputs.script }} -- $args
